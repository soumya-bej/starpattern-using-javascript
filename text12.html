<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hollow Left inverted pyramid</h1>

    <script>
        let n = 5; 
        for (let i = 1; i <= n; i++) { 
        let str = ''
        for(let j = 1; j <= n ; ++j){ 
        if(i+j==1+n||j==n) 
        str+='* '; 
        else
        str+='  '; 
    } 
  
    console.log(str); 
} 
    for (let i = n-1; i >= 1; i--) {     
    let str = ''
    for(let j = 1; j <= n ; ++j){ 
        if(i+j==n+1||j==n) 
        str+='* '; 
        else
        str+='  '; 
    } 
    console.log(str); 
}
    </script>
</body>
</html>
