<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Right inverted pyramid</h1>
    <script>
        let n = 5; 
        for (let i = 1; i <= n; i++) { 
	    let str = "* "; 
	    console.log(str.repeat(i)); 
     } 
        for (let i = n - 1; i >= 1; i--) { 
	    let str = "* "; 
	    console.log(str.repeat(i)); 
}

    </script>
</body>
</html>
