<body>
    <h1>Hollow upper pyramid</h1>

    <script>
        let n = 5; 
        for (let i = 1; i <= n; i++) { 
        let str = ''
        for(let j = 1; j <= 2*n-1 ; ++j){ 
        if(i+j == n +1||(i+n==j+1) ||i==n) 
        str+='* '; 
        else
        str+='  '; 
    } 
    console.log(str); 
}
    </script>
</body>
